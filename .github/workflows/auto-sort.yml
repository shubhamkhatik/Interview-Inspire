name: Auto-Sort Interview Questions

on:
  push:
    paths:
      - 'inbox.md'
    branches:
      - main
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  sort-and-classify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Questions from Issue (Mobile Trigger)
        if: github.event_name == 'issues'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/process_questions.py

      - name: Process Questions from inbox.md (Git Push Trigger)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/process_questions.py

      - name: Commit and Push Changes
        run: |
          git config user.name "Interview Bot"
          git config user.email "bot@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-sorted interview questions [skip ci]"
            git push origin main
          fi

      - name: Close Issue with Confirmation
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Questions successfully sorted!** The questions from this issue have been categorized, deduplicated, and added to the repository.'
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
